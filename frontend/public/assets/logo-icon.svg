<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients for Nodes & Graph -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2265" />
      <stop offset="100%" stop-color="#2D3282" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.3" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ── 1. AI KNOWLEDGE GRAPH (Emerging from Book) ── -->
  <g filter="url(#softGlow)">
    <!-- Connection Lines -->
    <line x1="34" y1="40" x2="62" y2="30" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" />
    <line x1="62" y1="30" x2="72" y2="56" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="34" y1="40" x2="72" y2="56" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />
    <line x1="62" y1="30" x2="104" y2="42" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="72" y1="56" x2="104" y2="42" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" />
    <line x1="104" y1="42" x2="132" y2="34" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="104" y1="42" x2="112" y2="68" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="72" y1="56" x2="80" y2="82" stroke="#6366F1" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Nodes (Purple / Magenta side) -->
    <circle cx="34" cy="40" r="6.5" fill="url(#purpleGrad)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="62" cy="30" r="8" fill="url(#purpleGrad)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="72" cy="56" r="6" fill="#6366F1" stroke="#FFFFFF" stroke-width="2" />

    <!-- Nodes (Cyan / Sky Blue side) -->
    <circle cx="104" cy="42" r="8" fill="url(#cyanGrad)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="132" cy="34" r="5.5" fill="url(#cyanGrad)" stroke="#FFFFFF" stroke-width="1.8" />
    <circle cx="112" cy="68" r="6" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2" />

    <!-- Data Particles (Small floating squares) -->
    <rect x="122" y="52" width="4.5" height="4.5" rx="1" fill="#06B6D4" transform="rotate(15 122 52)" />
    <rect x="88" y="24" width="4" height="4" rx="1" fill="#38BDF8" />
    <rect x="48" y="18" width="3.5" height="3.5" rx="1" fill="#A855F7" />
    <circle cx="86" cy="64" r="2" fill="#0EA5E9" />
  </g>

  <!-- ── 2. OPEN BOOK BASE ── -->
  <!-- Back / Spine Contour -->
  <path d="M18 78 C36 68 58 67 78 78 C80 79 80 79 82 78 C102 67 124 68 142 78 C144 79 146 81 146 84 L146 112 C146 114 144 116 142 115 C124 105 102 105 82 115 C80 116 80 116 78 115 C58 105 36 105 18 115 C16 116 14 114 14 112 L14 84 C14 81 16 79 18 78 Z" 
        fill="url(#bookCoverGrad)" />

  <!-- White / Blue Inner Page Accents -->
  <path d="M22 83 C38 74 58 74 76 83 L76 110 C58 101 38 101 22 110 Z" 
        fill="#FFFFFF" fill-opacity="0.9" />
  <path d="M138 83 C122 74 102 74 84 83 L84 110 C102 101 122 101 138 110 Z" 
        fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Center Crease Shadow -->
  <path d="M78 78 C80 79 80 79 82 78 L82 115 C80 116 80 116 78 115 Z" 
        fill="#1E1B4B" opacity="0.6" />

  <!-- Subtle Page Lines on Right Page -->
  <line x1="96" y1="88" x2="124" y2="88" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" />
  <line x1="96" y1="94" x2="120" y2="94" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" />
  <line x1="96" y1="100" x2="116" y2="100" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" />

  <!-- ── 3. MAGNIFYING GLASS (Search & Evidence Scrutiny) ── -->
  <g filter="url(#softGlow)">
    <!-- Handle -->
    <line x1="38" y1="104" x2="22" y2="124" stroke="#1E2265" stroke-width="7.5" stroke-linecap="round" />
    <line x1="38" y1="104" x2="22" y2="124" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" />

    <!-- Glass Rim -->
    <circle cx="48" cy="94" r="16" fill="url(#lensGrad)" stroke="#1E2265" stroke-width="4" />
    
    <!-- Lens Inner Highlight / Glare Arc -->
    <path d="M38 86 C42 82 48 81 54 83" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
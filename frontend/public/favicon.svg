<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" fill="none" />

  <!-- Academic Open Book & Research Vector Icon -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M16 22C21 21 27 22.5 31 25.5V45.5C27 42.5 21 41 16 42V22Z" 
          fill="#FFFFFF" 
          fill-opacity="0.95" />
    
    <!-- Right Page -->
    <path d="M48 22C43 21 37 22.5 33 25.5V45.5C37 42.5 43 41 48 42V22Z" 
          fill="#FFFFFF" 
          fill-opacity="0.95" />

    <!-- Center Spine / Book Binding -->
    <path d="M31 25.5C31.6 25 32.4 25 33 25.5V45.5C32.4 45 31.6 45 31 45.5V25.5Z" 
          fill="#DBEAFE" />

    <!-- Left Page Text Lines -->
    <path d="M20 28H27M20 33H27M20 38H25" 
          stroke="#3B82F6" 
          stroke-width="1.8" 
          stroke-linecap="round" />

    <!-- Right Page Text Lines -->
    <path d="M37 28H44M37 33H44M39 38H44" 
          stroke="#3B82F6" 
          stroke-width="1.8" 
          stroke-linecap="round" />

    <!-- Research Sparkle / Star on top right -->
    <path d="M46 14L47.2 17.8L51 19L47.2 20.2L46 24L44.8 20.2L41 19L44.8 17.8L46 14Z" 
          fill="url(#accentGrad)" />
  </g>
</svg>